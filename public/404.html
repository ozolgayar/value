<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Культурный путеводитель ГЕРОФАРМ</title>
    <script>
      // GitHub Pages SPA fallback: keep /value/ base and send deep links to index.html
      sessionStorage.setItem(
        'gph-spa-redirect',
        location.pathname + location.search + location.hash,
      )
      location.replace('/value/')
    </script>
  </head>
  <body></body>
</html>
